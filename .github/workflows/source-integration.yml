name: 2x2 source integration checks

on:
  pull_request:
    paths:
      - 'server/lib/admin.mjs'
      - 'server/lib/api.mjs'
      - 'site/admin.html'
      - 'site/js/admin-console.js'
      - 'tests/admin.test.mjs'
      - 'server/lib/ads.mjs'
      - 'server/lib/asset-resolver.mjs'
      - 'server/server.mjs'
      - 'server/lib/native-avatar-deps.mjs'
      - 'server/lib/native.mjs'
      - 'tests/native-avatar-deps.test.mjs'
      - 'tests/native-chat.test.mjs'
      - 'docs/AYAEX-INTEGRATION-PLAN.md'
      - 'tests/ads.test.mjs'
      - 'tests/asset-resolver.test.mjs'
      - 'tests/asset-upstream-errors.test.mjs'
      - 'server/lib/asset-discovery.mjs'
      - 'tools/seed-native-assets.mjs'
      - 'tools/seed-full-archive.mjs'
      - 'tools/scan-binary-asset-ids.py'
      - 'tools/rbxl_binary_inventory.py'
      - 'tests/native-asset-seeder.test.mjs'
      - 'tools/audit-asset-coverage.mjs'
      - 'tools/seed-novetus-assets.mjs'
      - 'services/engine/App/util/ContentProvider.cpp'
      - 'tests/test_engine_core_sources.py'
      - 'services/engine/.assets/content/scripts/**'
      - '.github/workflows/source-integration.yml'
      - 'site/img/userads/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regressions:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Asset and advertisement tests
        run: node --test tests/ads.test.mjs tests/asset-resolver.test.mjs tests/asset-upstream-errors.test.mjs tests/native-asset-seeder.test.mjs tests/native-avatar-deps.test.mjs tests/native-chat.test.mjs
      - name: Administrator syntax checks
        run: |
          node --check tools/audit-asset-coverage.mjs
          node --check tools/seed-novetus-assets.mjs
          node --check tools/seed-native-assets.mjs
          node --check tools/seed-full-archive.mjs
          node --check server/lib/asset-discovery.mjs
          python -m py_compile tools/scan-binary-asset-ids.py tools/rbxl_binary_inventory.py
          node --check server/lib/asset-resolver.mjs
          node --check server/lib/native.mjs
          node --check server/server.mjs
          node --check server/lib/admin.mjs
          node --check server/lib/api.mjs
          node --check site/js/admin-console.js
          node --check site/js/not-approved.js
          node --check site/js/common.js
      - name: Admin API authorization and TOTP tests
        run: node --test tests/admin.test.mjs
      - name: Native topbar chat health source tests
        run: python -m unittest discover -s tests -p test_engine_core_sources.py -v
