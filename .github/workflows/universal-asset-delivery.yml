name: Universal asset delivery
on:
  push:
    branches: [feature/universal-roblox-asset-pipeline]
  pull_request:
    paths:
      - 'server/lib/asset-resolver.mjs'
      - 'server/lib/asset-vfs.mjs'
      - 'server/lib/asset-discovery.mjs'
      - 'tools/inventory-asset-vfs.mjs'
      - 'tools/prepare-asset-vfs.mjs'
      - 'tools/analyze-place.py'
      - 'tools/rbxl_binary_inventory.py'
      - 'tools/scan-binary-asset-ids.py'
      - 'tests/asset-vfs.test.mjs'
      - 'tests/test_place_analysis.py'
      - 'tests/native-http.test.mjs'
      - 'server/lib/roblox-open-cloud.mjs'
      - 'tools/import-any-native.mjs'
      - 'tools/import-native.py'
      - 'tools/seed-native-assets.mjs'
      - 'tests/roblox-open-cloud.test.mjs'
      - 'tests/native-asset-seeder.test.mjs'
      - 'tests/asset-resolver.test.mjs'
      - 'tests/asset-upstream-errors.test.mjs'
      - 'server/lib/native.mjs'
      - 'server/lib/native-asset-prefetch.mjs'
      - 'server/lib/legacy-shared-assets.mjs'
      - 'tools/find-legacy-files.py'
      - 'tools/audit-native-place-scripts.py'
      - 'tests/native-asset-prefetch.test.mjs'
      - 'tests/legacy-shared-assets.test.mjs'
      - '.github/workflows/universal-asset-delivery.yml'
jobs:
  asset-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source syntax
        run: |
          node --check server/lib/asset-resolver.mjs
          node --check server/lib/asset-vfs.mjs
          node --check tools/inventory-asset-vfs.mjs
          node --check tools/prepare-asset-vfs.mjs
          node --check server/lib/roblox-open-cloud.mjs
          node --check tools/seed-native-assets.mjs
          node --check tools/import-any-native.mjs
          node --check server/lib/native.mjs
          node --check server/lib/native-asset-prefetch.mjs
          node --check server/lib/legacy-shared-assets.mjs
          python -m py_compile tools/import-native.py tools/install-native-asset-fixes.py tools/find-legacy-files.py tools/audit-native-place-scripts.py
      - name: Run offline regression tests
        run: node --test tests/asset-vfs.test.mjs tests/roblox-open-cloud.test.mjs tests/native-asset-seeder.test.mjs tests/asset-resolver.test.mjs tests/asset-upstream-errors.test.mjs tests/native-asset-prefetch.test.mjs tests/legacy-shared-assets.test.mjs tests/legacy-texture-map.test.mjs tests/native-http.test.mjs
      - name: Validate structural place analysis
        run: python -m unittest discover -s tests -p test_place_analysis.py -v
