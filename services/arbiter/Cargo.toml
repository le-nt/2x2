[package]
name = "arbiter"
version = "1.0.3"
edition = "2024"

[workspace]
members = [".", "resources"]

[dependencies]
resources = { path = "resources" } # RESOURCES LIB!!
bsoap = { git = "https://github.com/MoonicTeam/bsoap.git" }
clap = { version = "4.1", features = ["derive"] }
env_logger = "0.11.8"
log = "0.4.27"
reqwest = { version = "0.12.15", features = ["blocking", "json", "rustls-tls"] }
rocket = { version = "0.5.1", features = ["json", "tls"] }
serde_derive = "1.0.219"
serde_json = "1.0.140"
sysinfo = "0.34.2"
thiserror = "2.0.12"
tokio = {version="1.44.2", features = ["process"] }
uuid = { version="1.16.0", features=["v4"] }
windows-targets = "0.53.0"
yaserde = "0.12.0"
yaserde_derive = "0.12.0"
once_cell = "1.21.3"
rand = "0.9.1"
futures = "0.3.31"
rocket_ws = "0.1.1"
serde = {version="1.0.219", features = ["derive"]}
