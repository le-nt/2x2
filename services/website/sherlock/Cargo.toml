[package]
name = "sherlock-core"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.105"
console_error_panic_hook = "0.1.7"
log = "0.4"
console_log = "1.0"
web-sys = { version = "0.3.82", features = ["Document", "Element", "HtmlCanvasElement", "Window", "WebGlRenderingContext", "WebGlBuffer", "WebGlProgram", "WebGlShader", "console", "WebglDebugRendererInfo", "WebGlContextAttributes", "Headers", "Request", "RequestInit", "Response", "Location"] }
sha2 = "0.10.9"
hex = "0.4.3"
js-sys = "0.3.82"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

reqwest = { version = "0.11", features = ["json"] }
wasm-bindgen-futures = "0.4"

[build-dependencies]
chrono = "0.4.41"
