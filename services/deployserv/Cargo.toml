[package]
name = "deployserv"
version = "1.0.2"
edition = "2024"

[workspace]
members = [".", "entity", "migration", "admin-ui"]

[dependencies]
entity = { path = "entity" }
migration = { path = "migration" }

actix-web = "4"
sea-orm = { version = "1.1.0", features = [ "sqlx-postgres", "runtime-tokio-rustls", "macros" ] }
serde_json = "1.0"
once_cell = "1.18.0"
clap = "4.5.42"
serde_derive = "1.0.219"
tokio = {version="1.47.1", features=["full"]}
chrono = "0.4.41"
uuid = {version="1.17.0", features = ["v4"]}
serde = {version="1.0.219", features=["derive"]}
futures-util = "0.3.31"
crc64 = "2.0.0"
aws-sdk-s3 = "1.101.0"
aws-config = "1.8.4"
actix-cors = "0.7.1"
zorq-acl = "0.1.0"
sha2 = "0.10"
hex = "0.4"
rust-embed = "8.0"
mime_guess = "2.0"
sha1 = "0.10.6"

[profile.release]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2