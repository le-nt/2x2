<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friends - 2x2</title>
<link rel="stylesheet" href="css/site.css">
<script defer src="js/effects.js"></script>
<script defer src="js/motion.js"></script>
<link rel="icon" href="img/logo-2x2.png" type="image/png">
<link rel="stylesheet" href="css/retro.css">
<link rel="stylesheet" href="css/modern.css">
<link rel="stylesheet" href="css/r16.css">
</head>
<body>
<div id="App">
  <header id="Header"></header>
  <aside id="Sidebar" aria-label="Site"></aside>
  <div id="Page">
    <main id="Main">
      <div class="PageHead"><div><h1 class="PageTitle">Friends</h1><p class="PageSub">See who's online and add people you know.</p></div></div>
      <div class="Columns Flip">
        <div>
          <div class="StandardBox" id="IncomingBox" hidden>
            <div class="StandardBoxHeader"><span>Friend requests</span><span class="Pill red">New</span></div>
            <div class="FriendGrid" id="Incoming"></div>
          </div>
          <div class="StandardBox">
            <div class="StandardBoxHeader"><span id="FriendsTitle">Friends</span></div>
            <div class="FriendGrid" id="Friends"><div class="Empty">Loading&hellip;</div></div>
          </div>
          <div class="StandardBox" id="OutgoingBox" hidden>
            <div class="StandardBoxHeader">Requests you sent</div>
            <div class="FriendGrid" id="Outgoing"></div>
          </div>
        </div>
        <div class="StandardBox">
          <div class="StandardBoxHeader">Find people</div>
          <div class="BoxBody">
            <form class="Search" id="SearchForm" role="search"><input type="search" id="Q" placeholder="Username" maxlength="20" aria-label="Search users"><button class="Button Primary">Search</button></form>
            <div id="People" style="margin-top:12px"></div>
          </div>
        </div>
      </div>
    </main>
    <div id="FooterSlot"></div>
  </div>
</div>
<script src="js/common.js"></script>
<script src="js/avatar.js"></script>
<script>
(async function () {
  const me = await RB.page("Friends");
  if (!me) return;
  const items = await RB.items();
  const $ = (id) => document.getElementById(id);

  function cards(list, buttons) {
    return list.map((f) => `
      <div class="Friend" data-user="${RB.esc(f.username)}">
        <a class="Thumb" href="profile.html?u=${encodeURIComponent(f.username)}" aria-label="${RB.esc(f.username)}"><div data-av></div></a>
        <span class="Dot${f.online ? " on" : ""}" title="${f.online ? "Online" : "Offline"}"></span>${RB.userLink(f.username, "", f.staffRole)}
        ${f.status ? `<div class="Label">&ldquo;${RB.esc(f.status.slice(0, 40))}&rdquo;</div>` : ""}
        <div class="Actions">${buttons}</div>
      </div>`).join("");
  }
  function avatars(el, list) {
    el.querySelectorAll("[data-av]").forEach((d, i) => RBAvatar.render(d, list[i].avatar, items, { scale: 15, angle: -18, still: true }));
  }

  async function load() {
    const d = await RB.api("friends");
    $("FriendsTitle").textContent = `Friends (${d.friends.length})`;
    $("Friends").innerHTML = d.friends.length ? cards(d.friends, `<button type="button" class="Button" data-act="remove" data-confirm="1">Unfriend</button>`)
      : `<div class="Empty" style="grid-column:1/-1">No friends yet. Search for people on the right.</div>`;
    avatars($("Friends"), d.friends);
    $("IncomingBox").hidden = !d.incoming.length;
    $("Incoming").innerHTML = cards(d.incoming, `<button type="button" class="Button Green" data-act="accept">Accept</button><button type="button" class="Button" data-act="remove">Decline</button>`);
    avatars($("Incoming"), d.incoming);
    $("OutgoingBox").hidden = !d.outgoing.length;
    $("Outgoing").innerHTML = cards(d.outgoing, `<button type="button" class="Button" data-act="remove">Cancel</button>`);
    avatars($("Outgoing"), d.outgoing);
  }

  async function search() {
    const q = $("Q").value.trim();
    const d = await RB.api("users?q=" + encodeURIComponent(q));
    const others = d.users.filter((u) => u.username !== me.username);
    $("People").innerHTML = others.length ? others.map((u) => `<div class="PersonRow"><span class="Dot${u.online ? " on" : ""}"></span>
      <span class="Who">${RB.userLink(u.username, "", u.staffRole)}</span><span class="Label">joined ${RB.date(u.joined)}</span></div>`).join("") : `<p class="Label">Nobody found.</p>`;
  }

  document.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const user = b.closest("[data-user]").dataset.user;
    if (b.dataset.confirm && !(await RB.confirm(`Remove ${user} from your friends?`, { ok: "Unfriend", title: "Unfriend" }))) return;
    b.disabled = true;
    try { await RB.api(`friends/${encodeURIComponent(user)}/${b.dataset.act}`, { method: "POST" }); await load(); RB.refreshMe(); }
    catch (ex) { RB.alert(ex.message); b.disabled = false; }
  });
  $("SearchForm").addEventListener("submit", (e) => { e.preventDefault(); search(); });
  await Promise.all([load(), search()]);
})();
</script>
</body>
</html>
