<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Play - 2x2</title><link rel="icon" href="img/logo-2x2.png"><link rel="stylesheet" href="css/site.css"><link rel="stylesheet" href="css/retro.css">
<link rel="stylesheet" href="css/modern.css">
<link rel="stylesheet" href="css/r16.css"><script defer src="js/effects.js"></script>
<script defer src="js/motion.js"></script><style>html,body{height:100%}#App{height:100%;min-height:0;grid-template-rows:var(--top-h) minmax(0,1fr)}#Page,#PlayContainer{min-height:0}#GameCanvas{display:block;width:100%;height:100%;background:#000;outline:none}.NativeStatus{font-size:12px;color:var(--muted)}.NativeError{color:#ffbfdc}#NativeLog{max-height:120px;overflow:auto;white-space:pre-wrap;font-size:11px;text-align:left;color:#ddcfff}#Loading .Launcher{width:480px}#LauncherStage{overflow-wrap:anywhere}#NativeActions{display:flex;justify-content:center;gap:10px;margin-top:20px}</style></head><body><div id="App"><header id="Header"></header><aside id="Sidebar"></aside><div id="Page"><div id="PlayContainer"><div class="PlayBar"><div class="PlayTitle"><a class="Button Small" href="games.html">Back to games</a><b id="PlaceName">2x2</b></div><div class="PlayTools"><span class="NativeStatus" id="NativeStatus">Preparing native client</span><button class="Button Small" id="FullscreenBtn" type="button">Fullscreen</button><form action="/__lock" method="post"><button class="Button Small" type="submit">Lock website</button></form></div></div><div class="PlayerFrame" id="PlayerFrame"><canvas id="GameCanvas" tabindex="0" aria-label="2x2 native game" oncontextmenu="event.preventDefault()"></canvas><div class="LoadingOverlay" id="Loading" data-shader="tunnel"><div class="Launcher" role="status" aria-live="polite"><img class="Spinner" src="img/mark.svg" width="110" height="110" alt=""><div class="Text" id="LauncherText">Starting 2x2</div><div class="LauncherProgress"></div><p id="LauncherStage">Checking your account and game files</p><div id="NativeActions" hidden><button class="Button" id="RetryBtn" type="button">Try again</button><a class="Button" href="games.html">Back to games</a></div><details id="NativeDetails" hidden><summary>Client diagnostics</summary><pre id="NativeLog"></pre></details></div></div></div></div></div></div><script src="js/common.js"></script><script src="js/native-client.js"></script></body></html>
